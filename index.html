<body><div id="app">Chargement...</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyB5Fozxa9grXSkPTwCZwBaWtWsD2dNfj6c",authDomain:"beulou-test.firebaseapp.com",projectId:"beulou-test",appId:"1:789329554038:web:7ed8ccdb6eae677f59cd57"};
const SALT="beulou-test-v1:",HASH="1d265c88f523d9e63f2a2df03ccf8b9a90a470c920d8602ac5ffa815fb82302e"; // empreinte du code admin
const BRAND=big=>`<div class="brand ${big?'big':''}"><img src="logo.png" alt="Beulou Test" onerror="this.outerHTML='<h1 class=ttl>BEULOU TEST</h1>'"></div>`;
function askPin(){return new Promise(res=>{const o=document.createElement('div');o.className='ov';
 o.innerHTML='<div class="md"><h2>Accès admin</h2><input class="in" type="password" id="pin" placeholder="Code" autocomplete="current-password"><p class="er" id="pe"></p><button class="btn blk" id="pb">Entrer</button></div>';
 document.body.appendChild(o);const pin=o.querySelector('#pin'),pe=o.querySelector('#pe'),md=o.querySelector('.md');
 const go=async()=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+pin.value));
  const x=[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
  if(x===HASH){o.remove();res(true)}else{pe.textContent='Code incorrect';pin.value='';md.classList.remove('sh');void md.offsetWidth;md.classList.add('sh')}};
 o.querySelector('#pb').onclick=go;pin.onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>pin.focus(),50)})}
const RN=['Manche 1','Manche 2','Manche 3','Finale'];
const ADMIN=location.hash==='#admin';
if(ADMIN)document.body.classList.add('adm');
const app=document.getElementById('app');
if(!CFG.apiKey){app.innerHTML='<div class="c"><h2>Config Firebase manquante</h2></div>'}
else (async()=>{
if(ADMIN){app.innerHTML=BRAND(true);if(!await askPin())return;app.innerHTML=BRAND(true)}
firebase.initializeApp(CFG);
const fs=firebase.firestore(),FV=firebase.firestore.FieldValue;
const sdoc=()=>fs.collection('bt_sessions').doc(sid),tcol=()=>sdoc().collection('teams');
const Q=new URLSearchParams(location.search);
let sessions=[],sready=false,sid=null,view='list',g=null,gl=false,teams=[],tready=false,unG,unT,cfg=null,tab='prep',draft={},mk={},me=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const sum=a=>a.reduce((x,y)=>x+y,0);
const ERR=e=>{app.innerHTML='<div class="c"><h2>Erreur Firebase</h2><p>'+esc((e.code||'')+' '+(e.message||e))+'</p></div>'};
const blank=()=>({n:'',ea:true,et:true,q:[0,1,2,3,4,5].map(()=>({a:'',t:''}))});
const th=r=>(g.rounds?.[r]||[]).map(x=>{const q=[...(x.q||[])];while(q.length<6)q.push({a:'',t:''});return{n:x.n||'',ea:!!x.ea,et:!!x.et,q:q.slice(0,6),pts:x.ea&&x.et?1:2}});
const tn=(x,i)=>x.n||'Thème '+(i+1);
const score=(t,r)=>Object.entries(t.marks||{}).reduce((s,[k,m])=>{const[rr,tt]=k.split('_');if(r!=null&&+rr!==r)return s;const x=th(+rr)[+tt];return s+sum(m)*(x?x.pts:1)*(t.x2?.[rr]==tt?2:1)},0);
const vr=()=>[0,1,2,3].filter(r=>g.rd?.[r]==='validated');
const place=u=>{const a=teams.map(t=>({id:t.id,name:t.name,sc:sum(vr().filter(r=>r<=u).map(r=>score(t,r)))})).sort((x,y)=>y.sc-x.sc||x.name.localeCompare(y.name));a.forEach((x,i)=>x.pos=i&&a[i-1].sc===x.sc?a[i-1].pos:i+1);return a};
function rankInner(){
 const v=vr();if(!v.length||!teams.length)return'';
 const L=v[v.length-1],cur=place(L),pv=v.length>1?Object.fromEntries(place(v[v.length-2]).map(x=>[x.id,x.pos])):null;
 return`<h2>Classement</h2><p class="mut" style="margin:-4px 0 8px">Après ${RN[L]}</p>${cur.map(x=>{
  const t=teams.find(z=>z.id===x.id),gn=score(t,L);
  const ar=!pv?'':x.pos<pv[x.id]?'<span class="up">▲</span>':x.pos>pv[x.id]?'<span class="dn">▼</span>':'<span class="eq">=</span>';
  return`<div class="rk ${x.id===me?'me':''}"><span class="pos">${x.pos}</span><span class="nm">${esc(x.name)}</span>${ar}<span class="tt">${x.sc}</span><span class="gn">(+${gn})</span></div>`}).join('')}`}
const rankHtml=()=>{const i=rankInner();return i?`<div class="c">${i}</div>`:''};
const GB='<div class="gbg"><b></b><b></b><b></b><b></b><b></b><b></b><div class="nz"></div></div>';
const GC=(t,sub)=>`<div class="gm"><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div>`;
const MIRE=(t,s)=>`<div class="mire"><b></b><b></b><b></b><b></b><div class="nz"></div><div class="mt"><h2>${t}</h2>${s?`<p>${s}</p>`:''}</div></div>`;
const gset=o=>sdoc().set(o,{merge:true});

function bind(id){
 unG&&unG();unT&&unT();sid=id||null;g=null;gl=false;teams=[];tready=false;cfg=null;mk={};me=null;
 if(!sid)return;me=localStorage.getItem('bt_me_'+sid);
 unG=sdoc().onSnapshot(x=>{g=x.exists?Object.assign({r:-1,th:{},rd:{},rounds:{}},x.data()):null;gl=true;if(g&&!cfg)cfg=JSON.parse(JSON.stringify(g.rounds||{}));render()},ERR);
 unT=tcol().onSnapshot(x=>{teams=x.docs.map(d=>({id:d.id,...d.data()}));tready=true;render()},ERR);
}
if(ADMIN)fs.collection('bt_sessions').orderBy('created','desc').onSnapshot(x=>{sessions=x.docs.map(d=>({id:d.id,...d.data()}));sready=true;render()},ERR);
else bind(Q.get('s'));

function render(){
 if(ADMIN&&!sready)return;
 const a=document.activeElement,k=a&&a.dataset&&a.dataset.k,p=a&&a.selectionStart;
 let h;
 if(ADMIN){if(view==='sess'&&gl&&!g){view='list';bind(null)}
  h=view==='list'?alist():(gl&&tready?asess():'<div class="c">Chargement...</div>')}
 else h=team();
 app.innerHTML=h;
 if(k){const e=document.querySelector(`[data-k="${k}"]`);if(e){e.focus();try{e.setSelectionRange(p,p)}catch(x){}}}
}

function team(){
 const FR=x=>`<div class="frame">${x}</div>`;
 if(!sid)return BRAND(true)+FR(`<h3>Pas de session</h3><p class="mut hand">Ouvre le lien de ta soirée pour rejoindre la partie.</p>`);
 if(!gl||!tready)return GB+BRAND(true)+FR(GC('Chargement','Une seconde...'));
 if(!g)return BRAND(true)+FR(`<h3>Session introuvable</h3><p class="mut hand">Vérifie ton lien.</p>`);
 const T=g.title?`<h1 class="st">${esc(g.title)}</h1>`:'',Ts=g.title?`<h1 class="st sm">${esc(g.title)}</h1>`:'';
 if(!me)return BRAND(true)+FR(T+`<h3>Ton équipe</h3><label>Nom d'équipe</label><input class="in" data-k="nm" maxlength="28" placeholder="Les Chanteurs du Dimanche" value="${esc(draft.nm||'')}"><button class="btn blk" data-a="join">C'est parti</button>`);
 const t=teams.find(x=>x.id===me);
 if(!t)return BRAND(true)+FR(T+`<h3>Équipe introuvable</h3><p class="mut hand">La partie a été réinitialisée.</p><button class="btn blk" data-a="leave">Rejoindre à nouveau</button>`);
 const head=`<div class="row"><span class="chip cy">Équipe</span><b>${esc(t.name)}</b></div>`;
 const rk=rankInner(),RKB=rk?`<div class="sep"></div>${rk}`:'';
 const r=g.r,st=g.rd?.[r];
 if(r<0)return GB+BRAND(true)+FR(T+head+GC('Patience, la manche va commencer','Garde l\'oreille tendue')+RKB);
 if(st==='closed'||st==='validated')return GB+BRAND(true)+FR(T+head+(st==='closed'?GC('On calcule les scores','Les points arrivent, ne bouge pas'):GC('Scores validés','La manche suivante va commencer bientôt'))+RKB);
 const ids=th(r).map((_,i)=>`${r}_${i}`),opn=ids.some(k=>g.th?.[k]==='open'&&!t.done?.[k]);
 if(!opn){const wd=ids.some(k=>g.th?.[k]==='open'&&t.done?.[k]),stt=ids.some(k=>g.th?.[k]);
  return GB+BRAND(true)+FR(T+head+(wd?GC('Thème validé','On attend le prochain thème'):stt?GC('Le prochain thème va commencer','Garde l\'oreille tendue'):GC('La manche va commencer','Garde l\'oreille tendue'))+RKB)}
 let h=Ts+head+`<h3 style="margin-top:12px">${RN[r]}</h3>`;
 th(r).forEach((x,i)=>{
  const key=`${r}_${i}`,s=g.th?.[key],done=t.done?.[key],isOpen=s==='open'&&!done;
  const xi=t.x2?.[r],xlock=xi!=null&&t.done?.[`${r}_${xi}`];
  h+=`<div class="dw ${isOpen?'open':''}"><div class="dh"><span>${i+1}. ${esc(tn(x,i))}${xi===i?' <span class="x">x2</span>':''}</span><span class="chip ${done?'ok':s==='open'?'pk':''}">${done?'Validé':s==='closed'?'Clos':s==='open'?'En cours':'Bientôt'}</span></div>`;
  if(isOpen){
   h+=`<div class="db">`;
   for(let j=0;j<6;j++){const kk=`a|${key}|${j}`;h+=`<div class="qi"><i>${j+1}</i><input class="in" data-k="${kk}" autocomplete="off" enterkeyhint="next" placeholder="Artiste - Titre" value="${esc(draft[kk]??t.answers?.[key]?.[j]??'')}"></div>`}
   if(xi===i)h+=`<button class="btn pk blk" data-a="x2" data-t="${i}" data-v="-1">x2 activé sur ce thème</button>`;
   else if(!xlock)h+=`<button class="btn gh blk" data-a="x2" data-t="${i}">Mettre mon x2 ici</button>`;
   h+=`<button class="btn blk" data-a="done" data-t="${i}">Valider ce thème</button></div>`;
  }
  h+=`</div>`;
 });
 return BRAND(false)+FR(h+RKB);
}

const stat=s=>{const rd=s.rd||{};if(rd[3]==='validated')return['Terminée','cy'];if(Object.keys(rd).length)return['En cours','pk'];
 return Object.values(s.rounds||{}).some(a=>(a||[]).some(x=>(x.q||[]).some(q=>q.a||q.t)))?['Prête','ok']:['Brouillon','']};
function alist(){
 let h=BRAND(true)+`<h1 class="st">Sessions</h1>`;
 h+=`<div class="c"><h3>Nouvelle session</h3><label>Nom interne (pour toi)</label><input class="in" data-k="nn" placeholder="Ex : Soirée équipe Marketing" value="${esc(draft.nn||'')}"><label>Titre affiché aux équipes</label><input class="in" data-k="nt" placeholder="Ex : Beulou Test #4" value="${esc(draft.nt||'')}"><button class="btn blk" data-a="newsess">Créer la session</button></div>`;
 if(!sessions.length)h+=`<div class="c mut">Aucune session pour le moment.</div>`;
 sessions.forEach(s=>{const[l,c]=stat(s);
  h+=`<div class="c"><div class="row"><div class="f"><b>${esc(s.name||'Sans nom')}</b><br><small>${esc(s.title||'')} · ${new Date(s.created||0).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}</small></div><span class="chip ${c}">${l}</span></div><button class="btn blk" data-a="opens" data-id="${s.id}">Ouvrir</button></div>`});
 return h;
}

function asess(){
 let h=`<div class="row"><button class="btn gh sm" data-a="back">← Sessions</button><b class="f">${esc(g.name||'')}</b></div>`;
 const tabs=[['prep','Préparer'],...RN.map((n,i)=>[String(i),i<3?'Manche '+(i+1):'Finale']),['rank','Classement']];
 h+=`<div class="tabs">${tabs.map(([k,n])=>{const st=/^\d$/.test(k)?g.rd?.[k]:'';return`<button class="btn sm ${tab===k?'':'gh'}" data-a="tab" data-v="${k}">${n}${st==='validated'?' ✓':st==='open'?' ●':''}</button>`}).join('')}</div>`;
 if(tab==='prep')return h+prep();
 if(tab==='rank')return h+(rankHtml()||'<div class="c mut">Aucune manche validée pour le moment.</div>');
 return h+rscreen(+tab);
}
function prep(){
 let h='';const url=location.origin+location.pathname+'?s='+sid;
 h+=`<div class="c"><h3>Lien des équipes</h3><div class="lk">${esc(url)}</div><button class="btn sm" data-a="copy">Copier</button><a class="btn sm gh" href="${esc(url)}" target="_blank" style="text-decoration:none">Tester</a><p class="mut" style="margin:6px 0 0">Lien propre à cette session : les équipes ne voient que celle-ci.</p></div>`;
 h+=`<div class="c"><h3>Session</h3><label>Nom interne (pour toi)</label><input class="in" data-k="sn" value="${esc(draft.sn??g.name??'')}"><label>Titre affiché aux équipes</label><input class="in" data-k="stt" value="${esc(draft.stt??g.title??'')}"><button class="btn sm" data-a="saveinfo">Enregistrer</button></div>`;
 RN.forEach((n,r)=>{
  h+=`<div class="c"><h3>${n}</h3>`;
  (cfg[r]||[]).forEach((x,i)=>{
   h+=`<div class="dw"><div class="db" style="padding-top:14px"><label>Thème ${i+1}</label><input class="in" data-k="n|${r}|${i}" placeholder="Nom du thème" value="${esc(x.n)}">
   <button class="btn sm ${x.ea?'on':'gh'}" data-a="tg" data-r="${r}" data-t="${i}" data-f="ea">Artiste</button><button class="btn sm ${x.et?'on':'gh'}" data-a="tg" data-r="${r}" data-t="${i}" data-f="et">Titre</button><button class="btn sm dg" data-a="rmth" data-r="${r}" data-t="${i}">Supprimer</button>
   <p class="mut" style="margin:6px 0">${x.ea&&x.et?'1 point par réponse':'2 points par réponse'} (12 pts max)</p>`;
   for(let j=0;j<6;j++){const q=(x.q||[])[j]||{a:'',t:''};
    h+=`<div class="qi"><i>${j+1}</i>${x.ea?`<input class="in" data-k="q|${r}|${i}|${j}|a" placeholder="Artiste" value="${esc(q.a)}">`:''}${x.et?`<input class="in" data-k="q|${r}|${i}|${j}|t" placeholder="Titre" value="${esc(q.t)}">`:''}</div>`}
   h+=`</div></div>`});
  h+=`<button class="btn sm gh" data-a="addth" data-r="${r}">+ Thème</button></div>`;
 });
 return h+`<button class="btn blk y" data-a="savecfg">Enregistrer les questions</button>
 <div class="c" style="margin-top:14px"><h3>Nettoyage</h3><button class="btn sm gh" data-a="clrteams">Effacer les équipes</button><button class="btn sm gh" data-a="reset">Tout réinitialiser</button><button class="btn sm dg" data-a="delsess">Supprimer la session</button></div>`;
}
function rscreen(r){
 const T=th(r),st=g.rd?.[r],on=g.r===r&&st==='open',over=st==='closed'||st==='validated';
 let h=`<div class="c"><div class="row"><h2 class="rh f">${RN[r]}</h2><span class="chip ${st==='validated'?'ok':on?'pk':''}">${st==='validated'?'Validée':st==='closed'?'Clôturée':on?'En cours':'À venir'}</span></div><p class="mut" style="margin:0 0 8px">${teams.length} équipe(s)${teams.length?' : '+teams.map(t=>esc(t.name)).join(', '):''}</p>`;
 if(!T.length)return h+'<p class="mut">Aucun thème. Ajoute-les dans Préparer.</p></div>';
 if(!on&&!over)h+=`<button class="btn blk" data-a="launch" data-r="${r}">Ouvrir la manche</button>`;
 if(on){
  T.forEach((x,i)=>{const o=g.th?.[`${r}_${i}`];
   h+=`<div class="row"><span class="f"><b>${i+1}. ${esc(tn(x,i))}</b></span><span class="chip ${o==='open'?'pk':''}">${o==='open'?'Ouvert':o==='closed'?'Clos':'-'}</span><button class="btn sm ${o==='open'?'pk':''}" data-a="topen" data-r="${r}" data-t="${i}">Ouvrir</button><button class="btn sm gh" data-a="tclose" data-r="${r}" data-t="${i}">Clore</button></div>`});
  h+=`<button class="btn blk y" data-a="closeround" data-r="${r}" style="margin-top:10px">Clôturer la manche</button>`;
 }
 h+=`<div class="row" style="margin-top:8px"><button class="btn sm dg" data-a="resetround" data-r="${r}">Réinitialiser cette manche</button>${g.r>=0?`<button class="btn sm gh" data-a="idle">Écran d'attente</button>`:''}</div></div>`;
 if(on)return h+`<div class="c mut">Les corrections apparaîtront ici après la clôture de la manche.</div>`;
 if(!over)return h;
 T.forEach((x,i)=>{
  const key=`${r}_${i}`;
  h+=`<div class="c"><h3>${i+1}. ${esc(tn(x,i))}</h3>`;
  x.q.forEach((q,j)=>{
   const ca=[x.ea&&q.a,x.et&&q.t].filter(Boolean).join(' - ');
   h+=`<div class="qb"><i>${j+1}</i><b>${esc(ca)||'(non renseigné)'}</b></div>`;
   teams.forEach(t=>{const m=getMk(t,key,x),v=t.answers?.[key]?.[j]||'';
    h+=`<div class="ln"><div class="t"><small>${esc(t.name)}${t.x2?.[r]==i?' <span class="x">x2</span>':''}</small><span>${v?esc(v):'<i class="mut">(vide)</i>'}</span></div>`+
    (x.ea?`<button class="ab ${m[j*2]?'on':''}" data-a="mk" data-m="${sid}|${t.id}|${key}" data-i="${j*2}">👨‍🎤</button>`:'')+
    (x.et?`<button class="ab ${m[j*2+1]?'on':''}" data-a="mk" data-m="${sid}|${t.id}|${key}" data-i="${j*2+1}">🎶</button>`:'')+`</div>`});
  });
  h+=`<div class="sm2">${teams.map(t=>`${esc(t.name)} : <b>${sum(getMk(t,key,x))*x.pts*(t.x2?.[r]==i?2:1)}</b>`).join(' · ')}</div></div>`;
 });
 h+=`<button class="btn blk y" data-a="validate" data-r="${r}">${st==='validated'?'Revalider les corrections':'Valider les corrections'}</button>`;
 if(st==='validated'&&r<3)h+=`<button class="btn blk" data-a="tab" data-v="${r+1}" style="margin-top:8px">Passer à ${RN[r+1]}</button>`;
 return h;
}
function getMk(t,key,x){const k=sid+'|'+t.id+'|'+key;
 if(!mk[k])mk[k]=t.marks?.[key]?[...t.marks[key]]:x.q.flatMap((q,j)=>{const an=norm(t.answers?.[key]?.[j]);return[x.ea&&q.a&&an.includes(norm(q.a))?1:0,x.et&&q.t&&an.includes(norm(q.t))?1:0]});
 return mk[k]}

let tm;
function flush(key){
 const cur=teams.find(x=>x.id===me);
 const arr=[0,1,2,3,4,5].map(j=>draft[`a|${key}|${j}`]??cur?.answers?.[key]?.[j]??'');
 return tcol().doc(me).set({answers:{[key]:arr}},{merge:true});
}
async function delTeams(){const bt=fs.batch();teams.forEach(x=>bt.delete(tcol().doc(x.id)));await bt.commit();mk={}}
async function resetRound(r){
 const D=FV.delete(),keys=th(r).map((_,i)=>`${r}_${i}`),bt=fs.batch();
 teams.forEach(t=>{const o={['x2.'+r]:D};keys.forEach(k=>{o['answers.'+k]=D;o['done.'+k]=D;o['marks.'+k]=D});bt.update(tcol().doc(t.id),o)});
 const so={['rd.'+r]:D};keys.forEach(k=>so['th.'+k]=D);if(g.r===r)so.r=-1;bt.update(sdoc(),so);
 await bt.commit();mk={};
}
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;const v=e.target.value;
 if(['nm','nn','nt','sn','stt'].includes(k))draft[k]=v;
 else if(k.startsWith('a|')){draft[k]=v;clearTimeout(tm);const key=k.split('|')[1];tm=setTimeout(()=>flush(key),500)}
 else if(k.startsWith('n|')){const[,r,i]=k.split('|');cfg[r][i].n=v}
 else if(k.startsWith('q|')){const[,r,i,j,f]=k.split('|');cfg[r][i].q[j][f]=v}});
document.addEventListener('click',async e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const a=b.dataset.a,r=+b.dataset.r,t=+b.dataset.t;
 if(a==='tab'){tab=b.dataset.v;render();window.scrollTo(0,0)}
 if(a==='join'){const n=(draft.nm||'').trim();if(!n)return;me='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);localStorage.setItem('bt_me_'+sid,me);await tcol().doc(me).set({name:n,answers:{},done:{},x2:{},marks:{}})}
 if(a==='leave'){localStorage.removeItem('bt_me_'+sid);me=null;render()}
 if(a==='x2')tcol().doc(me).set({x2:{[g.r]:b.dataset.v?null:t}},{merge:true});
 if(a==='done'){const key=`${g.r}_${t}`;await flush(key);tcol().doc(me).set({done:{[key]:true}},{merge:true})}
 if(a==='newsess'){const n=(draft.nn||'').trim()||'Session '+new Date().toLocaleDateString('fr-FR');
  const rounds={};RN.forEach((_,i)=>rounds[i]=[blank(),blank(),blank()]);
  const ref=fs.collection('bt_sessions').doc();await ref.set({name:n,title:(draft.nt||'').trim()||n,created:Date.now(),rounds,r:-1,th:{},rd:{}});
  draft.nn=draft.nt='';view='sess';tab='prep';bind(ref.id);render()}
 if(a==='opens'){view='sess';tab='prep';draft={};bind(b.dataset.id);render()}
 if(a==='back'){view='list';bind(null);render()}
 if(a==='copy'){try{await navigator.clipboard.writeText(location.origin+location.pathname+'?s='+sid);b.textContent='Copié'}catch(x){b.textContent='Copie impossible'}}
 if(a==='saveinfo'){await gset({name:(draft.sn??g.name).trim(),title:(draft.stt??g.title).trim()});draft.sn=draft.stt=undefined;b.textContent='Enregistré'}
 if(a==='tg'){const x=cfg[r][t],f=b.dataset.f;x[f]=!x[f];if(!x.ea&&!x.et)x[f]=true;render()}
 if(a==='addth'){(cfg[r]=cfg[r]||[]).push(blank());render()}
 if(a==='rmth'&&confirm('Supprimer ce thème ?')){cfg[r].splice(t,1);render()}
 if(a==='savecfg'){await gset({rounds:cfg});b.textContent='Questions enregistrées'}
 if(a==='launch')gset({r,rd:{[r]:'open'}});
 if(a==='closeround'){const o={};th(r).forEach((_,i)=>o[`${r}_${i}`]='closed');gset({th:o,rd:{[r]:'closed'}})}
 if(a==='topen'){const o={};th(r).forEach((_,i)=>{if(g.th?.[`${r}_${i}`]==='open')o[`${r}_${i}`]='closed'});o[`${r}_${t}`]='open';gset({th:o})}
 if(a==='tclose')gset({th:{[`${r}_${t}`]:'closed'}});
 if(a==='idle')gset({r:-1});
 if(a==='mk'){const m=mk[b.dataset.m],i=+b.dataset.i;m[i]=m[i]?0:1;render()}
 if(a==='validate'){
  const bt=fs.batch();
  teams.forEach(tt=>th(r).forEach((x,i)=>{const key=`${r}_${i}`;bt.set(tcol().doc(tt.id),{marks:{[key]:getMk(tt,key,x)}},{merge:true})}));
  await bt.commit();gset({rd:{[r]:'validated'}});
 }
 if(a==='resetround'&&confirm('Réinitialiser '+RN[r]+' ? Réponses, x2 et points de cette manche seront effacés.'))resetRound(r);
 if(a==='clrteams'&&confirm('Effacer toutes les équipes et leurs réponses ?'))delTeams();
 if(a==='reset'&&confirm('Tout remettre à zéro (équipes, réponses, points, état des manches) ? Les questions sont conservées.')){await delTeams();await sdoc().update({r:-1,th:{},rd:{}})}
 if(a==='delsess'&&confirm('Supprimer définitivement cette session ?')){await delTeams();await sdoc().delete();view='list';bind(null);render()}
});
})();
</script></body></html>
